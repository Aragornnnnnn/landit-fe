<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상대 음성 흐름</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #16181d; --sub: #5b616e; --line: #d9dde4;
    --be: #2f6fed; --be-soft: #eaf1ff;
    --route: #0f8a6b; --route-soft: #e5f6f0;
    --dg: #101010; --dg-accent: #13ef93;
    --cdn: #b46a00; --cdn-soft: #fff3e0;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Pretendard, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .page { width: 960px; padding: 28px 30px 20px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 16px; letter-spacing: -0.02em; }

  .lane { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .lane-h { font-size: 16px; font-weight: 800; margin-bottom: 10px; }
  .row { display: grid; grid-template-columns: 250px 34px 170px 34px 1fr; align-items: center; }
  .row + .row { margin-top: 8px; }
  .box { border-radius: 10px; padding: 11px 14px; font-size: 15px; font-weight: 700; border: 1px solid transparent; }
  .box small { display: block; font-family: var(--mono); font-size: 11.5px; font-weight: 500; color: var(--sub); margin-top: 2px; }
  .be { background: var(--be-soft); border-color: #cfdcfb; color: var(--be); }
  .route { background: var(--route-soft); border-color: #bfe6d8; color: var(--route); }
  .cdn { background: var(--cdn-soft); border-color: #f4d8ac; color: var(--cdn); }
  .dg { background: var(--dg); color: #fff; display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .dg svg { width: 18px; height: 18px; fill: var(--dg-accent); }
  .arrow { display: flex; justify-content: center; color: #9aa1ad; }
  .arrow svg { width: 22px; height: 12px; }
  .bypass { grid-column: 3 / 5; display: flex; align-items: center; gap: 6px; color: var(--cdn); font-size: 12.5px; font-weight: 700; padding-right: 8px; }
  .bypass i { flex: 1; border-top: 2px dashed #e8c48a; }
</style>
</head>
<body>
<div class="page">
  <h1>상대 목소리는 어디서 만들어지나</h1>

  <div class="lane">
    <div class="lane-h">시나리오</div>
    <div class="row">
      <div class="box be">맞장구 문장<small>ttsText</small></div>
      <div class="arrow"><svg viewBox="0 0 22 12"><path d="M0 6h18M14 2l5 4-5 4" fill="none" stroke="currentColor" stroke-width="2"/></svg></div>
      <div class="box route">웹 서버 /api/tts</div>
      <div class="arrow"><svg viewBox="0 0 22 12"><path d="M0 6h18M14 2l5 4-5 4" fill="none" stroke="currentColor" stroke-width="2"/></svg></div>
      <div class="box dg"><svg viewBox="0 0 24 24"><path d="M11.203 24H1.517a.364.364 0 0 1-.258-.62l6.239-6.275a.366.366 0 0 1 .259-.108h3.52c2.723 0 5.025-2.127 5.107-4.845a5.004 5.004 0 0 0-4.999-5.148H7.613v4.646c0 .2-.164.364-.365.364H.968a.365.365 0 0 1-.363-.364V.364C.605.164.768 0 .969 0h10.416c6.684 0 12.111 5.485 12.01 12.187C23.293 18.77 17.794 24 11.202 24z"/></svg>Deepgram</div>
    </div>
    <div class="row">
      <div class="box be">질문 mp3 주소<small>questionAudioUrl</small></div>
      <div class="arrow"><svg viewBox="0 0 22 12"><path d="M0 6h18M14 2l5 4-5 4" fill="none" stroke="currentColor" stroke-width="2"/></svg></div>
      <div class="bypass"><i></i>합성 없이</div>
      <div class="box cdn">미리 만든 mp3 재생</div>
    </div>
  </div>

  <div class="lane">
    <div class="lane-h">스몰톡</div>
    <div class="row">
      <div class="box be">상대가 하는 말 전체<small>content</small></div>
      <div class="arrow"><svg viewBox="0 0 22 12"><path d="M0 6h18M14 2l5 4-5 4" fill="none" stroke="currentColor" stroke-width="2"/></svg></div>
      <div class="box route">웹 서버 /api/tts</div>
      <div class="arrow"><svg viewBox="0 0 22 12"><path d="M0 6h18M14 2l5 4-5 4" fill="none" stroke="currentColor" stroke-width="2"/></svg></div>
      <div class="box dg"><svg viewBox="0 0 24 24"><path d="M11.203 24H1.517a.364.364 0 0 1-.258-.62l6.239-6.275a.366.366 0 0 1 .259-.108h3.52c2.723 0 5.025-2.127 5.107-4.845a5.004 5.004 0 0 0-4.999-5.148H7.613v4.646c0 .2-.164.364-.365.364H.968a.365.365 0 0 1-.363-.364V.364C.605.164.768 0 .969 0h10.416c6.684 0 12.111 5.485 12.01 12.187C23.293 18.77 17.794 24 11.202 24z"/></svg>Deepgram</div>
    </div>
  </div>
</div>
</body>
</html>
