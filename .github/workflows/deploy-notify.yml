# Vercel 프로덕션 배포 결과를 디스코드 #웹-소식 채널로 알린다
name: deploy-notify

on: deployment_status

jobs:
  notify:
    # 프리뷰 배포와 진행 중 상태는 거른다. 깃허브 표현식의 == 는 대소문자를 가리지 않는다
    if: >-
      github.event.deployment.environment == 'Production' &&
      contains(fromJSON('["success", "failure", "error"]'), github.event.deployment_status.state)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 디스코드 전송
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ github.event.deployment_status.state }}
          SHA: ${{ github.event.deployment.sha }}
          SITE_URL: https://www.landit.im
          DASHBOARD_URL: https://vercel.com/aragonn/landit
          # 토스페이스 앱 이모지 CDN 주소 (landit-alerts scripts/upload-app-emoji.mjs로 올린 것)
          ROCKET: https://cdn.discordapp.com/emojis/1550045141799276565.png
          SIREN: https://cdn.discordapp.com/emojis/1550045143132798976.png
        run: |
          set -euo pipefail
          # 병합 커밋이면 그 PR 제목이 곧 배포 단위다. 직접 푸시된 커밋은 커밋 제목을 쓴다
          pr_number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            subject=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq '.title')
            source="[PR #$pr_number]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$pr_number)"
          else
            subject=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq '.commit.message' | head -1)
            source="[커밋 ${SHA:0:7}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA)"
          fi
          # 이 커밋에 태그가 붙어 있으면 릴리즈 배포다. 평소 배포는 비어 있다
          release=$(gh api "repos/$GITHUB_REPOSITORY/tags" --jq '.[] | select(.commit.sha == "'"$SHA"'") | .name' | head -1)
          if [ "$STATE" = "success" ]; then
            label='프로덕션 배포 완료'
            color=5763719
            icon="$ROCKET"
            links="[서비스 열기]($SITE_URL) · $source"
          else
            label='프로덕션 배포 실패'
            color=15548997
            icon="$SIREN"
            links="[Vercel 대시보드]($DASHBOARD_URL) · $source"
          fi
          if [ -n "$release" ]; then
            links="$links · [릴리즈 노트]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$release)"
          fi
          jq -n \
            --arg label "$label" \
            --arg icon "$icon" \
            --arg title "$subject" \
            --arg description "$links" \
            --arg release "$release" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson color "$color" \
            '{embeds: [{
              author: {name: $label, icon_url: $icon},
              title: $title,
              description: $description,
              color: $color,
              timestamp: $ts
            } + (if $release == "" then {} else {footer: {text: $release}} end)]}' \
            | curl -sS -f -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK"
