# PR마다 포맷·린트·타입체크·빌드를 검증하는 CI. 배포(CD)는 Vercel이 담당한다.
name: CI

# 검사 중 도는 코드가 쓰기 권한 토큰을 쥐지 않게 읽기만 준다 (checkout만 토큰을 쓴다)
permissions:
  contents: read

on:
  # 대상 브랜치를 열거하면 release/hotfix 케이스를 빠뜨리므로 모든 PR에서 실행
  pull_request:
  push:
    branches: [develop, main, release]

# 같은 브랜치에 새 푸시가 오면 진행 중이던 이전 실행을 취소 (Actions 분량 절약)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 검사마다 별도 잡으로 동시에 돌린다 — 순서대로 돌면 전체 시간이 합이 되고, 병렬이면 가장 느린 검사(테스트) 하나로 줄어든다
  ci:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # 하나가 실패해도 나머지를 끝까지 돌려 한 번에 모든 결과를 본다
      fail-fast: false
      matrix:
        task: [format:check, lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json의 packageManager 필드를 그대로 읽는다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # 터보 캐시를 실행 간에 이어 준다 — 없으면 매번 전부 cache miss라 터보가 CI에서 아무것도 건너뛰지 못한다.
      # 키는 커밋이 아니라 파일 내용(git tree 해시)이다. release PR·main 머지는 develop과 내용이 같아도 커밋이
      # 새로 생기므로, 내용 기준이어야 develop이 남긴 캐시를 찾는다. 내용이 다를 때 최근 캐시로 대신 복원하지
      # 않는다 — 터보는 캐시를 지우지 않아서, 복원한 위에 쌓아 저장하면 실행마다 캐시가 불어난다.
      # format:check는 터보를 거치지 않아 캐시가 없다
      - name: 파일 내용 해시
        if: matrix.task != 'format:check'
        id: tree
        run: echo "hash=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: matrix.task != 'format:check'
        with:
          path: .turbo/cache
          key: turbo-${{ matrix.task }}-${{ steps.tree.outputs.hash }}

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: ${{ matrix.task }}
        run: pnpm ${{ matrix.task }}
